<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{ config.TITLE }}</title>
  <style>
    :root {
      --primary: {{ config.COLORS.primary }};
      --secondary: {{ config.COLORS.secondary }};
      --bg: {{ config.COLORS.background }};
      --panel: {{ config.COLORS.panel }};
      --text: {{ config.COLORS.text }};
      --muted: {{ config.COLORS.muted }};
      --user: {{ config.COLORS.user }};
      --assistant: {{ config.COLORS.assistant }};
      --radius: {{ config.UI.radius }};
    }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;
      color:var(--text); background:linear-gradient(135deg,var(--bg),#ffffff); }
    .app { width:min(1100px,100%); height:100vh; margin:auto; display:flex; flex-direction:column; }
    header { padding:18px 20px; display:flex; align-items:center; gap:14px; border-bottom:1px solid #ffffff66;
      backdrop-filter:blur(16px); background:var(--panel); }
    .logo { width:48px;height:48px;border-radius:16px;display:grid;place-items:center;color:white;
      background:linear-gradient(135deg,var(--primary),var(--secondary));font-weight:800;font-size:21px; }
    h1 { margin:0;font-size:18px; } .domain { color:var(--muted);font-size:12px;margin-top:3px; }
    .clear { margin-left:auto;border:0;border-radius:12px;padding:9px 12px;background:#0000000b;color:var(--text);cursor:pointer; }
    main { flex:1; overflow:auto; padding:22px 16px; }
    .welcome { max-width:720px;margin:8vh auto 25px;text-align:center; }
    .welcome h2 { font-size:clamp(26px,5vw,44px);margin:0 0 10px; }
    .welcome p { color:var(--muted);line-height:1.6; }
    .messages { max-width:820px;margin:auto;display:flex;flex-direction:column;gap:12px; }
    .msg { display:flex; } .msg.user { justify-content:flex-end; }
    .bubble { max-width:min(78%,700px);padding:12px 15px;border-radius:var(--radius);line-height:1.55;white-space:pre-wrap;word-break:break-word; }
    .assistant .bubble { background:var(--assistant); } .user .bubble { background:var(--user); color:white; }
    .composer { padding:14px 16px 18px; background:var(--panel); backdrop-filter:blur(16px); }
    form { max-width:820px;margin:auto;display:flex;gap:10px; }
    textarea { flex:1;resize:none;min-height:52px;max-height:150px;border:1px solid #00000015;border-radius:var(--radius);
      padding:14px;background:white;color:var(--text);outline:none;font:inherit; }
    button.send { border:0;border-radius:var(--radius);padding:0 20px;background:var(--primary);color:white;font-weight:700;cursor:pointer; }
    button:disabled { opacity:.55;cursor:not-allowed; }
    .hint { max-width:820px;margin:8px auto 0;color:var(--muted);font-size:11px;text-align:center; }
    @media(max-width:600px){ header{padding:13px}.logo{width:42px;height:42px}.clear{padding:8px}.bubble{max-width:88%}
      main{padding:12px}.welcome{margin:5vh auto 20px}.composer{padding:10px}.send{min-width:60px} }
  </style>
</head>
<body>
<div class="app">
<header>
  <div class="logo">{{ config.LOGO }}</div>
  <div><h1>{{ config.TITLE }}</h1><div class="domain">AI assistant for {{ config.DOMAIN }}</div></div>
  <button class="clear" id="clear">Clear</button>
</header>
<main id="main">
  <section class="welcome" id="welcome">
    <h2>{{ config.WELCOME_TITLE }}</h2>
    <p>{{ config.WELCOME_MESSAGE }}</p>
  </section>
  <div class="messages" id="messages"></div>
</main>
<div class="composer">
<form id="form">
  <textarea id="input" placeholder="{{ config.PLACEHOLDER }}" rows="1"></textarea>
  <button class="send" id="send">Send</button>
</form>
<div class="hint">{{ config.BEHAVIOR }}</div>
</div>
</div>
<script>
const messages = document.getElementById("messages"), main = document.getElementById("main");
const input = document.getElementById("input"), send = document.getElementById("send"), welcome = document.getElementById("welcome");
function add(role,text){
  welcome.style.display="none";
  const row=document.createElement("div"); row.className="msg "+(role==="user"?"user":"assistant");
  const b=document.createElement("div"); b.className="bubble"; b.textContent=text; row.appendChild(b); messages.appendChild(row);
  main.scrollTop=main.scrollHeight;
}
async function load(){
  const r=await fetch("/api/history"); const d=await r.json();
  (d.messages||[]).forEach(m=>add(m.role,m.text));
}
document.getElementById("form").addEventListener("submit",async e=>{
  e.preventDefault(); const text=input.value.trim(); if(!text)return;
  add("user",text); input.value=""; send.disabled=true;
  try{
    const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:text})});
    const d=await r.json(); if(!r.ok) throw new Error(d.error||"Request failed"); add("assistant",d.answer);
  }catch(err){add("assistant","Sorry, "+err.message);}
  finally{send.disabled=false;input.focus();}
});
input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();document.getElementById("form").requestSubmit();}});
document.getElementById("clear").onclick=async()=>{await fetch("/api/clear",{method:"POST"});messages.innerHTML="";welcome.style.display="block";};
load();
</script>
</body>
</html>
